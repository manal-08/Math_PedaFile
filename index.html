    <style>

        }

        .header-brand {

<body>

<div class="app-card">

            </div>
            Math_PedaFile

    <div id="page1" class="page-1 no-print">

<div id="cropModal" class="modal-overlay hidden no-print">

        <div class="modal-crop-grid">

                    <button type="button" onclick="stepCrop('left', -1)">-</button>

            <div class="modal-crop-item">

                <div class="modal-crop-ctrl">
                    <button type="button" onclick="stepCrop('right', -1)">-</button>
                    <input type="number" id="cRight" value="0" min="0" max="45" oninput="updateModalCanvas()">
                    <button type="button" onclick="stepCrop('right', 1)">+</button>

            <div class="modal-crop-item">

                    <button type="button" onclick="stepCrop('top', 1)">+</button>

<script>
    let pdfBytesData = null;
    let slidesModel = [];
    let currentPreviewPage = 0;
    let editingIdx = null;

    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    document.getElementById('pdfFile').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                pdfBytesData = event.target.result;
                document.getElementById('fileInfo').classList.remove('hidden');
                document.getElementById('continueBtn').classList.remove('hidden');
            };
            reader.readAsArrayBuffer(file);
        }
    });

    /* دالة قص الفراغات البيضاء تلقائياً بدقة تامة */
    function autoTrimWhiteMargins(sourceCanvas) {
        const w = sourceCanvas.width;
        const h = sourceCanvas.height;
        const ctx = sourceCanvas.getContext('2d');
        const imgData = ctx.getImageData(0, 0, w, h).data;

        let top = h, bottom = 0, left = w, right = 0;
        let hasContent = false;

        for (let y = 0; y < h; y++) {
            for (let x = 0; x < w; x++) {
                const idx = (y * w + x) * 4;
                const r = imgData[idx];
                const g = imgData[idx + 1];
                const b = imgData[idx + 2];
                const a = imgData[idx + 3];

                if (a > 10 && (r < 248 || g < 248 || b < 248)) {
                    hasContent = true;
                    if (y < top) top = y;
                    if (y > bottom) bottom = y;
                    if (x < left) left = x;
                    if (x > right) right = x;
                }
            }
        }

        if (!hasContent) return sourceCanvas;

        const pad = 6;
        top = Math.max(0, top - pad);
        bottom = Math.min(h - 1, bottom + pad);
        left = Math.max(0, left - pad);
        right = Math.min(w - 1, right + pad);

        const trimW = right - left + 1;
        const trimH = bottom - top + 1;

        const trimmedCanvas = document.createElement('canvas');
        trimmedCanvas.width = trimW;
        trimmedCanvas.height = trimH;
        const tCtx = trimmedCanvas.getContext('2d');
        tCtx.drawImage(sourceCanvas, left, top, trimW, trimH, 0, 0, trimW, trimH);

        return trimmedCanvas;
    }

    /* دالة دمج القص التلقائي مع القص اليدوي لضمان سلامة الصورة */
    function getCroppedUrl(rawCanvas, crop) {
        let w = rawCanvas.width;
        let h = rawCanvas.height;
        let cL = Math.round((crop.left / 100) * w);
        let cR = Math.round((crop.right / 100) * w);
        let cT = Math.round((crop.top / 100) * h);
        let cB = Math.round((crop.bottom / 100) * h);

        let newW = Math.max(20, w - cL - cR);
        let newH = Math.max(20, h - cT - cB);

        let outCanvas = document.createElement('canvas');
        outCanvas.width = newW;
        outCanvas.height = newH;
        let ctx = outCanvas.getContext('2d');
        ctx.drawImage(rawCanvas, cL, cT, newW, newH, 0, 0, newW, newH);
        return outCanvas.toDataURL('image/png');
    }

    async function startApp() {
        document.getElementById('page1').style.display = 'none';
        document.getElementById('pageApp').style.display = 'block';

        const pdf = await pdfjsLib.getDocument({data: pdfBytesData}).promise;
        const totalPages = pdf.numPages;
        slidesModel = [];

        let startP = totalPages > 1 ? 2 : 1;

        for (let pNum = startP; pNum <= totalPages; pNum++) {
            let page = await pdf.getPage(pNum);
            let viewport = page.getViewport({ scale: 1.8 });
            let tempCanvas = document.createElement('canvas');
            let ctx = tempCanvas.getContext('2d');
            tempCanvas.height = viewport.height;
            tempCanvas.width = viewport.width;

            await page.render({ canvasContext: ctx, viewport: viewport }).promise;

            let trimmedCanvas = autoTrimWhiteMargins(tempCanvas);

            let initialCrop = { left: 0, right: 0, top: 0, bottom: 0 };
            let croppedUrl = getCroppedUrl(trimmedCanvas, initialCrop);

            slidesModel.push({
                id: pNum,
                rawCanvas: trimmedCanvas,
                crop: initialCrop,
                croppedUrl: croppedUrl,
                widthPct: 78,
                offsetY: 0
            });
        }

        currentPreviewPage = 0;
        renderAppUI();
    }

    function renderAppUI() {
        const container = document.getElementById('appContainer');
        container.innerHTML = "";

        let slidesPerPage = 2;
        let totalSheets = Math.ceil(slidesModel.length / slidesPerPage);
        if (currentPreviewPage >= totalSheets) currentPreviewPage = totalSheets - 1;
        if (currentPreviewPage < 0) currentPreviewPage = 0;

        for (let sheetIdx = 0; sheetIdx < totalSheets; sheetIdx++) {
            let i = sheetIdx * slidesPerPage;
            let currentCount = Math.min(slidesPerPage, slidesModel.length - i);

            const sheet = document.createElement('div');
            sheet.className = 'a4-sheet';

            let slidesHTML = "";
            for (let j = 0; j < currentCount; j++) {
                let idx = i + j;
                let s = slidesModel[idx];

                slidesHTML += `
                <div class="slide-item-simple" data-idx="${idx}" style="transform: translateY(${s.offsetY}px);">
                    <div class="slide-controls no-print">
                        <span>شريحة ${s.id}</span>
                        <div class="ctrl-btns">
                            <button type="button" class="btn-crop-modal" onclick="openCropModal(${idx})">✂️ قص</button>
                            <button type="button" onclick="appResize(${idx}, 4)">➕</button>
                            <button type="button" onclick="appResize(${idx}, -4)">➖</button>
                            <button type="button" onclick="appMove(${idx}, -8)">⬆️</button>
                            <button type="button" onclick="appMove(${idx}, 8)">⬇️</button>
                        </div>
                    </div>
                    <img id="app-img-${idx}" src="${s.croppedUrl}" style="width: ${s.widthPct}%;" />
                </div>`;
            }

            sheet.innerHTML = `
                <table class="jadada-table">
                    <thead>
                        <tr class="jadada-header">
                            <th class="side-col" style="width: 7%;">Séance</th>
                            <th class="side-col" style="width: 7%;">Durée</th>
                            <th class="contenu-col" style="width: 61%;">Contenu (Éléments du cours)</th>
                            <th class="side-col" style="width: 10%;">Rôle Ens.</th>
                            <th class="side-col" style="width: 10%;">Rôle App.</th>
                            <th class="side-col" style="width: 5%;">Obs.</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td class="side-col" contenteditable="true" style="text-align:center; font-weight:bold;"></td>
                            <td class="side-col" contenteditable="true"></td>
                            <td class="contenu-col content-cell">${slidesHTML}</td>
                            <td class="side-col" contenteditable="true"></td>
                            <td class="side-col" contenteditable="true"></td>
                            <td class="side-col" contenteditable="true"></td>
                        </tr>
                    </tbody>
                </table>
            `;
            container.appendChild(sheet);
        }

        updateViewVisibility();
    }

    function updateViewVisibility() {
        let slidesPerPage = 2;
        let totalSheets = Math.ceil(slidesModel.length / slidesPerPage);

        const sheets = document.querySelectorAll('.a4-sheet');
        sheets.forEach((sheet, idx) => {
            if (idx === currentPreviewPage) {
                sheet.style.display = 'block';
            } else {
                sheet.style.display = 'none';
            }
        });

        document.getElementById('pageIndicator').innerText = `الصفحة ${currentPreviewPage + 1} من ${totalSheets}`;
        document.getElementById('prevBtn').disabled = (currentPreviewPage === 0);
        document.getElementById('nextBtn').disabled = (currentPreviewPage >= totalSheets - 1);

        const printBtn = document.getElementById('printBtn');
        if (currentPreviewPage === totalSheets - 1) {
            printBtn.style.display = 'block';
        } else {
            printBtn.style.display = 'none';
        }
    }

    function changePreviewPage(delta) {
        let slidesPerPage = 2;
        let totalSheets = Math.ceil(slidesModel.length / slidesPerPage);
        currentPreviewPage += delta;
        if (currentPreviewPage >= totalSheets) currentPreviewPage = totalSheets - 1;
        if (currentPreviewPage < 0) currentPreviewPage = 0;
        updateViewVisibility();
    }

    function printAllSheets() {
        window.print();
    }

    function appResize(idx, delta) {
        slidesModel[idx].widthPct = Math.max(25, Math.min(100, slidesModel[idx].widthPct + delta));
        renderAppUI();
    }

    function appMove(idx, dy) {
        slidesModel[idx].offsetY += dy;
        renderAppUI();
    }

    function openCropModal(idx) {
        editingIdx = idx;
        let s = slidesModel[idx];
        document.getElementById('modalTitle').innerText = `قص الشريحة رقم ${s.id}`;
        document.getElementById('cLeft').value = s.crop.left;
        document.getElementById('cRight').value = s.crop.right;
        document.getElementById('cTop').value = s.crop.top;
        document.getElementById('cBottom').value = s.crop.bottom;

        document.getElementById('cropModal').classList.remove('hidden');
        updateModalCanvas();
    }

    function stepCrop(side, delta) {
        const map = { left: 'cLeft', right: 'cRight', top: 'cTop', bottom: 'cBottom' };
        const input = document.getElementById(map[side]);
        let val = (parseInt(input.value) || 0) + delta;
        input.value = Math.max(0, Math.min(45, val));
        updateModalCanvas();
    }

    function updateModalCanvas() {
        if (editingIdx === null) return;
        let s = slidesModel[editingIdx];
        let crop = {
            left: parseInt(document.getElementById('cLeft').value) || 0,
            right: parseInt(document.getElementById('cRight').value) || 0,
            top: parseInt(document.getElementById('cTop').value) || 0,
            bottom: parseInt(document.getElementById('cBottom').value) || 0
        };

        let raw = s.rawCanvas;
        let w = raw.width;
        let h = raw.height;
        let cL = Math.round((crop.left / 100) * w);
        let cR = Math.round((crop.right / 100) * w);
        let cT = Math.round((crop.top / 100) * h);
        let cB = Math.round((crop.bottom / 100) * h);

        let newW = Math.max(20, w - cL - cR);
        let newH = Math.max(20, h - cT - cB);

        let canvas = document.getElementById('modalCanvas');
        canvas.width = newW;
        canvas.height = newH;
        let ctx = canvas.getContext('2d');
        ctx.drawImage(raw, cL, cT, newW, newH, 0, 0, newW, newH);
    }

    function saveCropModal() {
        if (editingIdx === null) return;
        let s = slidesModel[editingIdx];
        s.crop = {
            left: parseInt(document.getElementById('cLeft').value) || 0,
            right: parseInt(document.getElementById('cRight').value) || 0,
            top: parseInt(document.getElementById('cTop').value) || 0,
            bottom: parseInt(document.getElementById('cBottom').value) || 0
        };
        s.croppedUrl = getCroppedUrl(s.rawCanvas, s.crop);
        closeCropModal();
        renderAppUI();
    }

    function closeCropModal() {
        document.getElementById('cropModal').classList.add('hidden');
        editingIdx = null;
    }
</script>

</body>
</html>
